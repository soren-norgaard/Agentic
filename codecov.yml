# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "60...100"
  
  status:
    project:
      default:
        target: auto
        threshold: 5%
        informational: true  # Don't fail PR checks initially
    patch:
      default:
        target: 80%
        threshold: 10%
        informational: true

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

flags:
  backend:
    paths:
      - sdlc-agent/src/
    carryforward: true

ignore:
  - "**/__pycache__/**"
  - "**/tests/**"
  - "**/*.pyc"
  - "**/migrations/**"
  - "**/alembic/**"
  - "sdlc-agent/frontend/**"
