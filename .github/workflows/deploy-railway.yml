name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, api, worker, frontend)'
        required: false
        default: 'all'

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  # ==========================================================================
  # Deploy API Service
  # ==========================================================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'api' || github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API to Railway
        working-directory: sdlc-agent
        run: railway up --service sdlc-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

  # ==========================================================================
  # Deploy Worker Service
  # ==========================================================================
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'worker' || github.event_name == 'push'
    needs: deploy-api  # Worker depends on API being deployed first
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Worker to Railway
        working-directory: sdlc-agent
        run: railway up --service sdlc-worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

  # ==========================================================================
  # Deploy Frontend Service
  # ==========================================================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'frontend' || github.event_name == 'push'
    needs: deploy-api  # Frontend needs API URL
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Frontend to Railway
        working-directory: sdlc-agent/frontend
        run: railway up --service sdlc-frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

  # ==========================================================================
  # Post-deployment Health Check
  # ==========================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-worker, deploy-frontend]
    if: always() && needs.deploy-api.result == 'success'
    
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check API Health
        run: |
          API_URL="${{ vars.RAILWAY_API_URL || 'https://sdlc-api.up.railway.app' }}"
          curl -f "$API_URL/health" || echo "Health check failed - service may still be starting"
